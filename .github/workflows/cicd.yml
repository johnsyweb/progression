name: CI/CD

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache aube store
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.local/share/aube/store
          key: ${{ runner.os }}-aube-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aube-

      - name: Install dependencies
        run: ./script/ci-install

      - name: Build
        run: ./script/build

      - name: Cache dist
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: dist
          key: build-${{ hashFiles('**/aube-lock.yaml', 'src/**', 'vite.config.ts') }}

  lint-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache aube store
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.local/share/aube/store
          key: ${{ runner.os }}-aube-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aube-

      - name: Install dependencies
        run: ./script/ci-install

      - name: Restore dist cache
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        id: dist-cache
        with:
          path: dist
          key: build-${{ hashFiles('**/aube-lock.yaml', 'src/**', 'vite.config.ts') }}

      - name: Build if cache miss
        if: steps.dist-cache.outputs.cache-hit != 'true'
        run: ./script/build

      - name: Install Playwright browsers
        run: aube exec playwright install --with-deps chromium

      - name: Lint
        run: ./script/lint

      - name: Type check
        run: ./script/typecheck

      - name: Run tests
        run: ./script/test

      - name: Audit dependencies
        run: ./script/audit

  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache aube store
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.local/share/aube/store
          key: ${{ runner.os }}-aube-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aube-

      - name: Install dependencies
        run: ./script/ci-install

      - name: Restore dist cache
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        id: dist-cache
        with:
          path: dist
          key: build-${{ hashFiles('**/aube-lock.yaml', 'src/**', 'vite.config.ts') }}

      - name: Build if cache miss
        if: steps.dist-cache.outputs.cache-hit != 'true'
        run: ./script/build
        env:
          BASE_URL: /${{ github.event.repository.name }}/

      - name: Install Chromium for Lighthouse
        run: aube exec playwright install --with-deps chromium

      - name: Run Lighthouse
        run: aube run lighthouse
        env:
          BASE_URL: /${{ github.event.repository.name }}/

  screenshot:
    if: ${{ github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]' }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache aube store
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.local/share/aube/store
          key: ${{ runner.os }}-aube-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aube-

      - name: Install dependencies
        run: ./script/ci-install

      - name: Restore dist cache
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        id: dist-cache
        with:
          path: dist
          key: build-${{ hashFiles('**/aube-lock.yaml', 'src/**', 'vite.config.ts') }}

      - name: Build if cache miss
        if: steps.dist-cache.outputs.cache-hit != 'true'
        run: ./script/build
        env:
          BASE_URL: /${{ github.event.repository.name }}/

      - name: Install Playwright browsers
        run: aube exec playwright install --with-deps chromium

      - name: Generate screenshot and report drift
        env:
          BASE_URL: /${{ github.event.repository.name }}/
        run: |
          aube exec vite preview --port 4173 --strictPort --host localhost &
          preview_pid=$!
          sleep 8
          aube run generate:screenshot
          kill "$preview_pid" 2>/dev/null || true
          wait "$preview_pid" 2>/dev/null || true

          if ! git diff --exit-code assets/screenshot.png; then
            echo "::warning::README screenshot changed. Run 'aube run generate:screenshot' locally and commit assets/screenshot.png."
          fi

  build-for-deploy:
    runs-on: ubuntu-latest
    needs: [build, lint-test, lighthouse, screenshot]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache aube store
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.local/share/aube/store
          key: ${{ runner.os }}-aube-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aube-

      - name: Install dependencies
        run: ./script/ci-install

      - name: Build
        env:
          BASE_URL: /${{ github.event.repository.name }}/
        run: ./script/build

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-for-deploy
    if: success()
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
