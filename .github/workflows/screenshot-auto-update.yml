name: Screenshot Auto Update

# Disabled for now — no scheduled or push-triggered screenshot PRs.
# Re-enable by restoring `push` (main) and/or `schedule` under `on:`.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshot-update:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]' }}
    env:
      # Must match the port Vite preview binds to (see scripts/generate-readme-screenshot.ts).
      PREVIEW_PORT: '4173'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache aube store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/aube/store
          key: ${{ runner.os }}-aube-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aube-

      - name: Install dependencies
        run: ./script/ci-install

      - name: Build
        env:
          BASE_URL: /${{ github.event.repository.name }}/
        run: ./script/build

      - name: Install Playwright browsers
        run: aube exec playwright install --with-deps chromium

      - name: Generate screenshot
        env:
          BASE_URL: /${{ github.event.repository.name }}/
        run: |
          aube exec vite preview --port "$PREVIEW_PORT" --strictPort --host localhost &
          preview_pid=$!
          sleep 8
          aube run generate:screenshot
          kill "$preview_pid" 2>/dev/null || true
          wait "$preview_pid" 2>/dev/null || true

      - name: Create screenshot update PR
        id: cpr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        env:
          # Avoid pre-push (build + lighthouse preview on 4173) while port is still in use.
          HUSKY: '0'
        with:
          # GITHUB_TOKEN pushes do not start other workflows (recursive-run guard). Use a PAT
          # so CI runs on the screenshot PR; see https://docs.github.com/en/actions/concepts/security/github_token#when-github_token-triggers-workflow-runs
          token: ${{ secrets.SCREENSHOT_PR_PAT || github.token }}
          commit-message: 'chore(assets): update screenshot'
          title: 'chore(assets): update screenshot'
          body: |
            Automated screenshot refresh generated by CI.
          branch: chore/screenshot-auto-update
          delete-branch: true
          add-paths: |
            assets/screenshot.png

      - name: Enable auto-merge for screenshot PR
        if: ${{ steps.cpr.outputs.pull-request-number != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.SCREENSHOT_PR_PAT || github.token }}
        run: gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}" --repo "${{ github.repository }}"
